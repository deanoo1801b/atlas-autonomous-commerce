name: Atlas Daily Content

on:
  workflow_dispatch:
  schedule:
    # 08:15 UK time in winter (UTC); GitHub schedules use UTC.
    - cron: "15 8 * * *"

permissions:
  contents: read

concurrency:
  group: atlas-daily-content
  cancel-in-progress: false

jobs:
  create-shopify-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r automation/requirements.txt
      - name: Generate Shopify blog draft
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_BLOG_ID: ${{ secrets.SHOPIFY_BLOG_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PUBLISH_MODE: draft
        run: python automation/daily_content.py
