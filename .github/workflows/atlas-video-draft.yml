name: ATLAS Video Draft (Free Prototype)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Short topic or product category for the draft"
        required: true
        default: "Everyday home essentials worth discovering"
        type: string

permissions:
  contents: read

jobs:
  render-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install free video and speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak librsvg2-bin
      - name: Render draft video
        env:
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: node scripts/render-video-draft.mjs
      - name: Upload draft MP4 and caption
        uses: actions/upload-artifact@v4
        with:
          name: atlas-video-draft
          path: |
            video-output/atlas-video-draft.mp4
            video-output/CAPTION.txt
          if-no-files-found: error
          retention-days: 7
