name: Inspiration Properties Tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "property-agents/**"
      - ".github/workflows/inspiration-property-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "property-agents/**"
      - ".github/workflows/inspiration-property-tests.yml"

permissions:
  contents: read

concurrency:
  group: inspiration-property-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-agents/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r property-agents/requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile property-agents/*.py

      - name: Validate controlled-autonomy safety settings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("property-agents/config/agents.json").read_text(encoding="utf-8"))
          expected = {
              "mode": "controlled_autonomy",
              "contacting_enabled": False,
              "referral_enabled": False,
              "publishing_enabled": False,
          }
          for key, value in expected.items():
              if config.get(key) != value:
                  raise SystemExit(f"Unsafe configuration: {key}={config.get(key)!r}; expected {value!r}")
          print("Controlled-autonomy safety settings passed.")
          PY

      - name: Run offline unit tests
        working-directory: property-agents
        env:
          ATLAS_PROPERTY_AGENT_DRY_RUN: "true"
        run: python -m unittest discover -s tests -v
