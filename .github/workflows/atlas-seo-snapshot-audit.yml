name: ATLAS SEO Snapshot Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * 1-5"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and audit public homepage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const target = "https://atlasgoodsstore.co.uk/";
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 15000);
          try {
            const response = await fetch(target, {
              redirect: "follow",
              signal: controller.signal,
              headers: { "user-agent": "ATLAS-SEO-Snapshot-Audit/1.0" }
            });
            const finalUrl = new URL(response.url);
            if (finalUrl.protocol !== "https:" ||
                !(finalUrl.hostname === "atlasgoodsstore.co.uk" ||
                  finalUrl.hostname.endsWith(".atlasgoodsstore.co.uk"))) {
              throw new Error("Redirect left the approved Atlas domain.");
            }
            const html = await response.text();
            const decode = (value = "") => value
              .replace(/&amp;/gi, "&").replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'").replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">").replace(/\s+/g, " ").trim();
            const title = decode(html.match(/<title\b[^>]*>([\s\S]*?)<\/title\s*>/i)?.[1]?.replace(/<[^>]+>/g, " ") ?? "");
            const descriptions = [...html.matchAll(/<meta\b[^>]*>/gi)]
              .map(m => m[0]).filter(tag => /\bname\s*=\s*["']description["']/i.test(tag));
            const metaDescription = decode(descriptions[0]?.match(/\bcontent\s*=\s*["']([^"']*)["']/i)?.[1] ?? "");
            const h1s = [...html.matchAll(/<h1\b[^>]*>([\s\S]*?)<\/h1\s*>/gi)]
              .map(m => decode(m[1].replace(/<[^>]+>/g, " "))).filter(Boolean);
            const canonicalTag = [...html.matchAll(/<link\b[^>]*>/gi)]
              .map(m => m[0]).find(tag => /\brel\s*=\s*["']canonical["']/i.test(tag));
            const canonical = canonicalTag?.match(/\bhref\s*=\s*["']([^"']+)["']/i)?.[1] ?? "";
            const robotsNoindex = [...html.matchAll(/<meta\b[^>]*>/gi)]
              .some(m => /\bname\s*=\s*["']robots["']/i.test(m[0]) &&
                /\bcontent\s*=\s*["'][^"']*noindex/i.test(m[0]));
            const images = [...html.matchAll(/<img\b[^>]*>/gi)].map(m => m[0]);
            const missingAlt = images.filter(tag => !/\balt\s*=/.test(tag) || /\balt\s*=\s*["']\s*["']/.test(tag)).length;
            const report = {
              checkedAt: new Date().toISOString(),
              httpStatus: response.status,
              finalUrl: finalUrl.href,
              title: title || null,
              titleLength: title.length,
              metaDescription: metaDescription || null,
              metaDescriptionLength: metaDescription.length,
              h1Count: h1s.length,
              h1: h1s.slice(0, 5),
              canonical: canonical || null,
              robotsNoindex: robotsNoindex,
              imageCount: images.length,
              imagesMissingAlt: missingAlt,
              notes: []
            };
            if (!response.ok) report.notes.push("Homepage did not return a successful HTTP status.");
            if (!title) report.notes.push("Missing homepage title.");
            if (title.length > 60) report.notes.push("Title is longer than a common search-result guideline; review manually.");
            if (!metaDescription) report.notes.push("Missing meta description.");
            if (metaDescription.length > 160) report.notes.push("Meta description is long; review manually.");
            if (h1s.length !== 1) report.notes.push("Homepage H1 count is not exactly one; review rendered page and template.");
            if (!canonical) report.notes.push("Canonical link was not detected.");
            if (robotsNoindex) report.notes.push("Homepage robots directive contains noindex.");
            if (missingAlt) report.notes.push(`${missingAlt} image(s) lack a non-empty alt attribute.`);
            console.log("ATLAS_SEO_REPORT_BEGIN");
            console.log(JSON.stringify(report, null, 2));
            console.log("ATLAS_SEO_REPORT_END");
            if (!response.ok) process.exitCode = 1;
          } catch (error) {
            console.error("SEO snapshot failed:", error?.name === "AbortError" ? "request timed out after 15 seconds" : error?.message ?? "unknown error");
            process.exitCode = 1;
          } finally {
            clearTimeout(timer);
          }
          NODE
