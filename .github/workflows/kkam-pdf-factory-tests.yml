name: KKAM Books PDF Factory Tests

on:
  push:
    branches: ["main"]
    paths:
      - "kkam-books/**"
      - ".github/workflows/kkam-pdf-factory-tests.yml"
  pull_request:
    paths:
      - "kkam-books/**"
      - ".github/workflows/kkam-pdf-factory-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional open-source PDF test tools
        run: pip install -r kkam-books/requirements-optional.txt
      - name: Run unit and PDF QA tests
        run: PYTHONPATH=kkam-books/src python -m unittest discover -s kkam-books/tests -v
