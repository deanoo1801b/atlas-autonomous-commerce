name: Inspiration Properties Source Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspiration-properties-source-health
  cancel-in-progress: false

jobs:
  official-source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r property-agents/requirements.txt

      - name: Validate syntax
        run: python -m py_compile property-agents/source_health_check.py

      - name: Run read-only official-source checks
        env:
          ATLAS_SOURCE_HEALTH_REPORT_PATH: source-health-report.json
        run: python property-agents/source_health_check.py

      - name: Upload source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspiration-properties-source-health
          path: source-health-report.json
          if-no-files-found: warn
          retention-days: 14
