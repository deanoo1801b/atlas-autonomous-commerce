name: Inspiration Properties Background Scanner

on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "fix/property-rent-to-buy-classification"]
    paths:
      - "agents/property_opportunity_scanner.py"
      - "agents/property_query_classifier.py"
      - "agents/rent_to_buy_search_config.py"
      - "agents/rent_to_buy_source_directory.json"
      - "tests/test_property_scanner_dry_run.py"
      - ".github/workflows/inspiration-property-scanner.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: inspiration-properties-background-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test URL normalization safeguards
        run: python -m unittest discover -s tests -p 'test_property_scanner_dry_run.py' -v

      - name: Run public-source opportunity scan
        if: github.event_name != 'pull_request'
        run: python agents/property_opportunity_scanner.py

      - name: Prepare non-writing Smartsheet dry-run
        if: github.event_name != 'pull_request'
        run: python agents/property_scanner_dry_run.py

      - name: Save scan and dry-run results
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: inspiration-property-scan-${{ github.run_number }}
          path: property-agent-output/
          if-no-files-found: error
          retention-days: 14
