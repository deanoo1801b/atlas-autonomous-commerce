name: Inspiration Properties Agent Engine

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "property-agents/**"
      - ".github/workflows/property-agent-engine.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: inspiration-properties-agent-engine
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r property-agents/requirements.txt

      - name: Validate required secrets
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          PROPERTY_LEADS_SHEET_ID: ${{ secrets.PROPERTY_LEADS_SHEET_ID }}
          FINANCE_OPPORTUNITIES_SHEET_ID: ${{ secrets.FINANCE_OPPORTUNITIES_SHEET_ID }}
        run: |
          test -n "$SMARTSHEET_API_TOKEN" || { echo "::error::SMARTSHEET_API_TOKEN is not configured"; exit 1; }
          test -n "$PROPERTY_LEADS_SHEET_ID" || { echo "::error::PROPERTY_LEADS_SHEET_ID is not configured"; exit 1; }
          test -n "$FINANCE_OPPORTUNITIES_SHEET_ID" || { echo "::error::FINANCE_OPPORTUNITIES_SHEET_ID is not configured"; exit 1; }
          echo "Required secret configuration is present."

      - name: Run controlled pipeline
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          PROPERTY_LEADS_SHEET_ID: ${{ secrets.PROPERTY_LEADS_SHEET_ID }}
          FINANCE_OPPORTUNITIES_SHEET_ID: ${{ secrets.FINANCE_OPPORTUNITIES_SHEET_ID }}
        run: python property-agents/engine.py
