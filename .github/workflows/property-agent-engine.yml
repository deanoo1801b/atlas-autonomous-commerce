name: Inspiration Properties Agent Engine

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "property-agents/**"
      - ".github/workflows/property-agent-engine.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: inspiration-properties-agent-engine
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: property-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r property-agents/requirements.txt

      - name: Verify open-properties installation
        run: |
          property --version
          property providers

      - name: Validate Python syntax
        run: python -m py_compile property-agents/*.py

      - name: Validate autonomy configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("property-agents/config/agents.json").read_text(encoding="utf-8"))
          required = {
              "mode": "controlled_autonomy",
              "contacting_enabled": False,
              "referral_enabled": False,
              "publishing_enabled": False,
          }
          for key, expected in required.items():
              if cfg.get(key) != expected:
                  raise SystemExit(f"Unsafe configuration: {key}={cfg.get(key)!r}; expected {expected!r}")

          engine = Path("property-agents/engine.py").read_text(encoding="utf-8")
          forbidden_ids = (
              "95VHjPc74mJh2Q6485MHCqGjQP5p97wmW4x54Rg1",
              "3007077934124932",
              "890673877438340",
          )
          for value in forbidden_ids:
              if value in engine:
                  raise SystemExit(f"Hard-coded Smartsheet ID detected in engine.py: {value}")

          print("Autonomy configuration and secret-driven sheet configuration are valid.")
          PY

      - name: Run offline unit tests
        working-directory: property-agents
        run: python -m unittest discover -s tests -v

      - name: Validate required secrets
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          PROPERTY_LEADS_SHEET_ID: ${{ secrets.PROPERTY_LEADS_SHEET_ID }}
          FINANCE_OPPORTUNITIES_SHEET_ID: ${{ secrets.FINANCE_OPPORTUNITIES_SHEET_ID }}
        run: |
          if [ -n "$SMARTSHEET_API_TOKEN" ] && [ -n "$PROPERTY_LEADS_SHEET_ID" ] && [ -n "$FINANCE_OPPORTUNITIES_SHEET_ID" ]; then
            echo "Required secret configuration is present."
            echo "ATLAS_PROPERTY_AGENT_DRY_RUN=false" >> "$GITHUB_ENV"
          else
            echo "::warning::Smartsheet secrets are not fully configured; agent will run safely in DRY_RUN."
            echo "ATLAS_PROPERTY_AGENT_DRY_RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Run controlled pipeline
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          PROPERTY_LEADS_SHEET_ID: ${{ secrets.PROPERTY_LEADS_SHEET_ID }}
          FINANCE_OPPORTUNITIES_SHEET_ID: ${{ secrets.FINANCE_OPPORTUNITIES_SHEET_ID }}
        run: python property-agents/engine.py

      - name: Upload contract route review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-contract-route-review-queue
          path: property-route-review-queue.json
          if-no-files-found: ignore

      - name: Upload contract route review HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-contract-route-review-html
          path: property-route-review-queue.html
          if-no-files-found: ignore

      - name: Upload scan audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-agent-scan-audit
          path: property-agent-scan-report.json
          if-no-files-found: ignore
